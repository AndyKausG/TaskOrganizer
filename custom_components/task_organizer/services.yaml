adjust_points:
  name: Adjust points
  description: Gives a kid bonus points or deducts points (e.g. as a consequence) and records it in the history with a reason. Admin only. A kid never drops below 0 points.
  fields:
    kid_id:
      name: Kid
      description: The kid's person entity (or participant ID).
      required: true
      example: person.anna
      selector:
        entity:
          domain: person
    points:
      name: Points
      description: Positive for a bonus, negative for a deduction (1 to 50, either way).
      required: true
      example: 5
      selector:
        number:
          min: -50
          max: 50
          mode: box
    reason:
      name: Reason
      description: Why? Shown in the protocol (max. 80 characters).
      required: true
      example: Helped without being asked
      selector:
        text:
